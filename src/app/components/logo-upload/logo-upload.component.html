<div>
  <label class="block text-sm font-medium text-slate-700 mb-1.5">Company logo</label>

  <div
    class="relative flex items-center gap-4 rounded-lg border-2 border-dashed p-4 transition-colors"
    [class.border-emerald-400]="isDragging"
    [class.bg-emerald-50]="isDragging"
    [class.border-slate-300]="!isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave()"
    (drop)="onDrop($event)"
  >
    <div
      class="flex h-16 w-16 shrink-0 items-center justify-center overflow-hidden rounded-md bg-slate-100 ring-1 ring-slate-200"
    >
      <img
        *ngIf="logoDataUrl"
        [src]="logoDataUrl"
        alt="Company logo preview"
        class="h-full w-full object-contain"
      />
      <svg
        *ngIf="!logoDataUrl"
        xmlns="http://www.w3.org/2000/svg"
        class="h-7 w-7 text-slate-400"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.25 15.75l5.159-5.159a2.25 2.25 0 013.182 0l5.159 5.159m-1.5-1.5l1.409-1.409a2.25 2.25 0 013.182 0l2.909 2.909M3 16.5h18M3 8.25h18M3 5.25h18"
        />
      </svg>
    </div>

    <div class="min-w-0 flex-1">
      <p class="text-sm text-slate-600">
        Drag &amp; drop your logo here, or
        <label class="cursor-pointer font-medium text-emerald-700 hover:text-emerald-800">
          browse
          <input type="file" accept="image/*" class="hidden" (change)="onFileSelected($event)" />
        </label>
      </p>
      <p class="text-xs text-slate-400">PNG, JPG or SVG, up to 2MB. Scaled to 512px automatically.</p>
      <p *ngIf="error" class="mt-1 text-xs font-medium text-rose-600">{{ error }}</p>
    </div>

    <button
      *ngIf="logoDataUrl"
      type="button"
      (click)="removeLogo()"
      class="shrink-0 rounded-md px-2 py-1 text-xs font-medium text-slate-500 hover:bg-slate-100 hover:text-rose-600"
    >
      Remove
    </button>
  </div>
</div>
